{% extends 'base.html' %}
{% load static %}

{% block content %}
<head>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

.result-container {
    max-width: 700px;
    width: 90%;
    margin: 80px auto;
    background: linear-gradient(135deg, rgba(255,255,255,0.98) 0%, rgba(248,249,250,0.98) 100%);
    padding: 60px 40px;
    border-radius: 20px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.2);
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
    animation: fadeInUp 0.6s ease-out;
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.result-icon {
    width: 80px;
    height: 80px;
    margin: 0 auto 25px;
    background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 20px rgba(76, 175, 80, 0.3);
}

.result-icon::after {
    content: '₹';
    font-size: 40px;
    color: white;
    font-weight: bold;
}

h1 {
    font-size: 42px;
    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 20px;
    line-height: 1.3;
    letter-spacing: -0.5px;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
}

.result-label {
    font-size: 16px;
    color: #718096;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
    font-weight: 600;
}

.action-buttons {
    margin-top: 40px;
    display: flex;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
}

.btn {
    padding: 14px 30px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
    display: inline-block;
}

.btn-primary {
    background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
    color: white;
    box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
}

.btn-secondary {
    background: #ffffff;
    color: #4a5568;
    border: 2px solid #e2e8f0;
}

.btn-secondary:hover {
    background: #f7fafc;
    border-color: #cbd5e0;
    transform: translateY(-2px);
}

/* Responsive design */
@media (max-width: 768px) {
    .result-container {
        margin: 40px auto;
        padding: 40px 25px;
    }

    h1 {
        font-size: 32px;
    }

    .result-icon {
        width: 65px;
        height: 65px;
    }

    .result-icon::after {
        font-size: 32px;
    }

    .action-buttons {
        flex-direction: column;
    }

    .btn {
        width: 100%;
    }
}

@media (max-width: 480px) {
    .result-container {
        padding: 30px 20px;
    }

    h1 {
        font-size: 26px;
    }
}
</style>
</head>

<div class="result-container">
    <div class="result-icon"></div>
    <div class="result-label">Predicted Price</div>
    <h1>{{ msg }}</h1>
    
    <div class="action-buttons">
        <a href="{% url 'prediction' %}" class="btn btn-primary">Calculate Again</a>
        <a href="{% url 'home' %}" class="btn btn-secondary">Back to Home</a>
    </div>
</div>

{% endblock %}
